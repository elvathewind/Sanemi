        function checkAndGeneratePartnerInitiatedLetter() {
            const now = Date.now();
            let lastPartnerLetterTime = Number(localStorage.getItem('lastPartnerLetterTime')) || 0;
            
            if (!lastPartnerLetterTime) {
                lastPartnerLetterTime = now;
                localStorage.setItem('lastPartnerLetterTime', lastPartnerLetterTime);
            }

            const elapsed = now - lastPartnerLetterTime;
            const randomTargetInterval = (Math.random() * (168 - 72) + 72) * 60 * 60 * 1000;

            if (elapsed >= randomTargetInterval) {
                if (cardLibrary.length > 0) {
                    const count = Math.min(cardLibrary.length, Math.floor(Math.random() * (15 - 5 + 1)) + 5);
                    let selected = [];
                    let tempLib = [...cardLibrary];
                    for (let i = 0; i < count; i++) {
                        const idx = Math.floor(Math.random() * tempLib.length);
                        selected.push(tempLib[idx].content);
                        tempLib.splice(idx, 1);
                    }
                    const partnerLetterContent = selected.join(' ');

                    const d = new Date();
                    const timeStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

                    letters.push({
                        id: now,
                        isPartnerInitiated: true,
                        myLetter: '',
                        reply: partnerLetterContent,
                        time: timeStr,
                        estTime: '不久的将来',
                        replyTimestamp: now,
                        isRead: false,
                        partnerLetterTime: timeStr,
                        myReplyToPartner: '',
                        continuationReplies: []
                    });

                    localStorage.setItem('lastPartnerLetterTime', now);
                    saveData();
                }
            }
        }

        function checkAndSpawnFlyingEnvelope(container) {
            if (activeFlyingEnvelopeEl) {
                activeFlyingEnvelopeEl.remove();
                activeFlyingEnvelopeEl = null;
            }

            const unreadReadyLetter = letters.find(item => {
                const isSentReady = !item.isPartnerInitiated && item.reply && !item.isRead;
                const isReceivedReady = item.isPartnerInitiated && (item.partnerReplyContent && !item.isRead || (!item.myReplyToPartner && !item.isRead));
                const isContinuationReady = item.continuationReplies && item.continuationReplies.some(cr => cr.replyContent && !item.isRead);
                return isSentReady || isReceivedReady || isContinuationReady;
            });

            if (!unreadReadyLetter) return;

            const badge = document.createElement('div');
            badge.className = 'flying-envelope-badge';
            badge.innerHTML = `
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="#ffb6c1" stroke-width="2" fill="none"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                <span style="font-size:12px; font-weight:bold; color:var(--text-color);">有一封新的回信请查收</span>
            `;

            badge.onclick = () => {
                unreadReadyLetter.isRead = true;
                saveData();
                badge.remove();
                activeFlyingEnvelopeEl = null;
                updateLettersList();
                
                const targetCard = document.getElementById(`letter-item-${unreadReadyLetter.id}`);
                if (targetCard) {
                    targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    targetCard.style.borderColor = '#ffb6c1';
                    setTimeout(() => { targetCard.style.borderColor = 'var(--border-color)'; }, 1500);
                }
            };

            container.appendChild(badge);
            activeFlyingEnvelopeEl = badge;
        }

        function sendLetter() {
            const inputEl = document.getElementById('letterInput');
            if(!inputEl) return;
            const text = inputEl.value.trim();
            if (!text) return;

            const now = Date.now();
            const minMs = 12 * 60 * 60 * 1000;
            const maxMs = 48 * 60 * 60 * 1000;
            const randomDelay = Math.floor(Math.random() * (maxMs - minMs + 1)) + minMs;

            const d = new Date();
            const timeStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;

            letters.push({
                id: now,
                isPartnerInitiated: false,
                myLetter: text,
                reply: '',
                time: timeStr,
                estTime: '不久的将来',
                replyTimestamp: now + randomDelay,
                isRead: false,
                replyTime: '',
                continuationReplies: []
            });

            inputEl.value = '';
            saveData();
            updateLettersList();
        }

        function replyToPartnerLetter(id) {
            const letter = letters.find(l => l.id === id);
            if (!letter) return;
            const text = prompt('给他的信写回信：', '');
            if (!text || !text.trim()) return;

            const now = Date.now();
            const minMs = 12 * 60 * 60 * 1000;
            const maxMs = 48 * 60 * 60 * 1000;
            const randomDelay = Math.floor(Math.random() * (maxMs - minMs + 1)) + minMs;

            const d = new Date();
            const timeStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;

            letter.myReplyToPartner = text.trim();
            letter.myReplyTime = timeStr;
            letter.partnerReplyTimestamp = now + randomDelay;
            letter.partnerEstTime = '不久的将来';
            letter.partnerReplyContent = '';
            saveData();
            updateLettersList();
        }

        function continueReplyLetter(id) {
            const letter = letters.find(l => l.id === id);
            if (!letter) return;
            const text = prompt('回信：', '');
            if (!text || !text.trim()) return;

            const now = Date.now();
            const minMs = 12 * 60 * 60 * 1000;
            const maxMs = 48 * 60 * 60 * 1000;
            const randomDelay = Math.floor(Math.random() * (maxMs - minMs + 1)) + minMs;

            const d = new Date();
            const timeStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;

            if (!letter.continuationReplies) letter.continuationReplies = [];
            letter.continuationReplies.push({
                text: text.trim(),
                time: timeStr,
                estTime: '不久的将来',
                replyTimestamp: now + randomDelay,
                replyContent: '',
                replyTime: ''
            });
            saveData();
            updateLettersList();
        }

        function updateLettersList() {
            const container = document.getElementById('letterListContainer');
            if (!container) return;
            container.innerHTML = '';

            const now = Date.now();
            let hasNewUnread = false;

            letters.forEach(item => {
                if (!item.isPartnerInitiated && !item.reply && cardLibrary.length > 0 && now >= item.replyTimestamp) {
                    const count = Math.min(cardLibrary.length, Math.floor(Math.random() * (20 - 5 + 1)) + 5);
                    let selected = [];
                    let tempLib = [...cardLibrary];
                    for (let i = 0; i < count; i++) {
                        const idx = Math.floor(Math.random() * tempLib.length);
                        selected.push(tempLib[idx].content);
                        tempLib.splice(idx, 1);
                    }
                    item.reply = selected.join(' ');
                    
                    const d = new Date();
                    item.replyTime = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                    item.isRead = false;
                    saveData();
                }

                if (item.isPartnerInitiated && item.myReplyToPartner && !item.partnerReplyContent && cardLibrary.length > 0 && item.partnerReplyTimestamp && now >= item.partnerReplyTimestamp) {
                    const count = Math.min(cardLibrary.length, Math.floor(Math.random() * (20 - 5 + 1)) + 5);
                    let selected = [];
                    let tempLib = [...cardLibrary];
                    for (let i = 0; i < count; i++) {
                        const idx = Math.floor(Math.random() * tempLib.length);
                        selected.push(tempLib[idx].content);
                        tempLib.splice(idx, 1);
                    }
                    item.partnerReplyContent = selected.join(' ');
                    const d = new Date();
                    item.partnerReplyActualTime = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                    item.isRead = false;
                    saveData();
                }

                if (item.continuationReplies && item.continuationReplies.length > 0) {
                    item.continuationReplies.forEach(cr => {
                        if (!cr.replyContent && cardLibrary.length > 0 && cr.replyTimestamp && now >= cr.replyTimestamp) {
                            const count = Math.min(cardLibrary.length, Math.floor(Math.random() * (20 - 5 + 1)) + 5);
                            let selected = [];
                            let tempLib = [...cardLibrary];
                            for (let i = 0; i < count; i++) {
                                const idx = Math.floor(Math.random() * tempLib.length);
                                selected.push(tempLib[idx].content);
                                tempLib.splice(idx, 1);
                            }
                            cr.replyContent = selected.join(' ');
                            const d = new Date();
                            cr.replyTime = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                            item.isRead = false;
                            saveData();
                        }
                    });
                }

                if ((item.reply && !item.isRead && !item.isPartnerInitiated) ||
                    (item.isPartnerInitiated && (item.partnerReplyContent && !item.isRead || (!item.myReplyToPartner && !item.isRead))) ||
                    (item.continuationReplies && item.continuationReplies.some(cr => cr.replyContent && !item.isRead))) {
                    hasNewUnread = true;
                }
            });

            // 锦书分类过滤：
            // 'sent' 模块：只存放你主动寄出的信 (!item.isPartnerInitiated)
            // 'received' 模块：存放对方主动寄出的信以及对方回复你的信 (item.isPartnerInitiated)
            const filteredLetters = letters.filter(item => {
                if (currentLetterTab === 'sent') return !item.isPartnerInitiated;
                else return item.isPartnerInitiated;
            });

            const sortedLetters = [...filteredLetters].sort((a, b) => b.id - a.id);

            if (sortedLetters.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:var(--sub-text); font-size:13px; padding:20px;">暂无${currentLetterTab==='sent'?'寄出':'收到'}的信件记录</div>`;
                return;
            }

            sortedLetters.forEach(item => {
                const div = document.createElement('div');
                div.id = `letter-item-${item.id}`;
                div.style.cssText = "margin: 0 8px; padding:12px; display:flex; flex-direction:column; gap:6px; background:var(--bg-color); border:1px solid var(--border-color); border-radius:8px; transition:border-color 0.3s;";
                
                let heartColor = '';
                let topTimeText = '';
                let cardContentHTML = '';

                if (item.isPartnerInitiated) {
                    heartColor = '#ff6b6b';
                    topTimeText = `写信时间: ${item.partnerLetterTime || item.time}`;
                    
                    let partnerReplyHTML = '';
                    if (item.myReplyToPartner) {
                        if (item.partnerReplyContent) {
                            partnerReplyHTML = `
                                <div style="margin-top:6px; padding-top:6px; border-top:1px dashed var(--border-color);">
                                    <div style="font-size:11px; color:var(--sub-text); margin-bottom:2px;">回信时间: ${item.partnerReplyActualTime || item.partnerEstTime}</div>
                                    <strong>他的回信：</strong>
                                    <div style="max-height: 180px; overflow-y: auto; margin-top: 4px; white-space: pre-wrap;">${item.partnerReplyContent}</div>
                                </div>
                            `;
                        } else {
                            partnerReplyHTML = `
                                <div style="margin-top:6px; padding-top:6px; border-top:1px dashed var(--border-color);">
                                    <div style="font-size:11px; color:var(--sub-text);">寄出时间: ${item.myReplyTime} | 预计回信时间: ${item.partnerEstTime || '不久的将来'}</div>
                                    <div style="margin-top:4px;"><strong>我的回信:</strong> ${item.myReplyToPartner}</div>
                                </div>
                            `;
                        }
                    }

                    let replySection = item.myReplyToPartner ? partnerReplyHTML : `
                        <div style="margin-top:6px;">
                            <button class="btn" style="padding:4px 10px; font-size:11px; background:var(--text-color); color:var(--card-bg);" onclick="replyToPartnerLetter(${item.id})">回复此信</button>
                        </div>
                    `;

                    cardContentHTML = `
                        <div style="font-weight:bold; color:var(--text-color);">对方主动写给你的信</div>
                        <div style="border-top:1px dashed var(--border-color); padding-top:6px; max-height: 180px; overflow-y: auto; white-space: pre-wrap; color:var(--text-color);">${item.reply}</div>
                        ${replySection}
                    `;
                } else if (!item.reply) {
                    heartColor = '#ff8787';
                    topTimeText = `寄出时间: ${item.time} | 预计回信时间: ${item.estTime || '不久的将来'}`;
                    cardContentHTML = `
                        <div><strong>我:</strong> ${item.myLetter}</div>
                        <div style="font-size:12px; color:var(--sub-text); font-style:italic; border-top:1px dashed var(--border-color); padding-top:6px;">真羡慕这封信，可以比我更早见到你</div>
                    `;
                } else {
                    heartColor = '#fa5252';
                    topTimeText = `寄出时间: ${item.time} | 回信时间: ${item.replyTime || '已送达'}`;
                    
                    let continuationHTML = '';
                    if (item.continuationReplies && item.continuationReplies.length > 0) {
                        item.continuationReplies.forEach(cr => {
                            let crReplyBlock = '';
                            if (cr.replyContent) {
                                crReplyBlock = `
                                    <div style="margin-top:4px; padding-top:4px; border-top:1px dashed var(--border-color);">
                                        <div style="font-size:11px; color:var(--sub-text); margin-bottom:2px;">回信时间: ${cr.replyTime || cr.estTime}</div>
                                        <strong>他的回信：</strong>
                                        <div style="white-space:pre-wrap; margin-top:2px;">${cr.replyContent}</div>
                                    </div>
                                `;
                            } else {
                                crReplyBlock = `
                                    <div style="margin-top:4px; padding-top:4px; border-top:1px dashed var(--border-color);">
                                        <div style="font-size:11px; color:var(--sub-text);">寄出时间: ${cr.time} | 预计回信时间: ${cr.estTime || '不久的将来'}</div>
                                        <div style="margin-top:2px;"><strong>回信:</strong> ${cr.text}</div>
                                    </div>
                                `;
                            }
                            continuationHTML += `<div style="margin-top:4px; background:rgba(120,120,120,0.04); padding:6px; border-radius:6px;">${crReplyBlock}</div>`;
                        });
                    }

                    const lastCr = item.continuationReplies && item.continuationReplies.length > 0 ? item.continuationReplies[item.continuationReplies.length - 1] : null;
                    const canContinue = !lastCr || lastCr.replyContent;

                    let continueBtnHTML = canContinue ? `
                        <div style="margin-top:6px;">
                            <button class="btn" style="padding:4px 10px; font-size:11px; background:var(--text-color); color:var(--card-bg);" onclick="continueReplyLetter(${item.id})">回信</button>
                        </div>
                    ` : '';

                    cardContentHTML = `
                        <div><strong>我:</strong> ${item.myLetter}</div>
                        <div style="border-top:1px dashed var(--border-color); padding-top:6px; color:var(--text-color);">
                            <strong>回信：</strong>
                            <div style="max-height: 180px; overflow-y: auto; margin-top: 4px; padding-right: 4px; white-space: pre-wrap;">${item.reply}</div>
                        </div>
                        ${continuationHTML}
                        ${continueBtnHTML}
                    `;
                }

                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div style="display:flex; align-items:center; gap:6px;">
                            <span style="color:${heartColor}; font-size:16px; line-height:1; display:inline-block;">♥</span>
                            <span style="font-size:11px; color:var(--sub-text);">${topTimeText}</span>
                        </div>
                        <button class="btn" style="padding:2px 8px; font-size:11px; background:none; border:1px solid var(--border-color); color:var(--text-color);" onclick="deleteLetter(${item.id})">删除</button>
                    </div>
                    ${cardContentHTML}
                `;

                container.appendChild(div);
            });

            if (hasNewUnread && !activeFlyingEnvelopeEl) {
                const subContent = document.getElementById('subPageContent');
                if (subContent) checkAndSpawnFlyingEnvelope(subContent);
            }
        }

        function deleteLetter(id) {
            if (confirm("确定要删除这封信吗？")) {
                letters = letters.filter(l => l.id !== id);
                saveData();
                updateLettersList();
                if (activeFlyingEnvelopeEl && !letters.some(item => (item.reply && !item.isRead && !item.isPartnerInitiated) || (item.isPartnerInitiated && item.partnerReplyContent && !item.isRead))) {
                    activeFlyingEnvelopeEl.remove();
                    activeFlyingEnvelopeEl = null;
                }
            }
        }

        // --- 良辰模块 ---
        function checkAndExecutePartnerAnnivCheckIn() {
            const todayStr = new Date().toISOString().slice(0, 10);
            if (annivCheckInData.partnerLastCheckInDate !== todayStr) {
                if (Math.random() < 0.65) {
                    annivCheckInData.partnerLastCheckInDate = todayStr;
                    if (annivCheckInData.myLastCheckInDate === todayStr) {
                        annivCheckInData.totalDays += 1;
                    }
                    saveData();
                }
            }
        }

        function handleMyCheckIn() {
            const todayStr = new Date().toISOString().slice(0, 10);
            if (annivCheckInData.myLastCheckInDate === todayStr) {
                alert('今天已经打过卡啦！');
                return;
            }

            annivCheckInData.myLastCheckInDate = todayStr;
            if (annivCheckInData.partnerLastCheckInDate === todayStr) {
                annivCheckInData.totalDays += 1;
            }
            saveData();
            initAnniversary(document.getElementById('subPageContent'));
        }

        function initAnniversary(container) {
            checkAndExecutePartnerAnnivCheckIn();
            
            const todayStr = new Date().toISOString().slice(0, 10);
            const myChecked = annivCheckInData.myLastCheckInDate === todayStr;
            const partnerChecked = annivCheckInData.partnerLastCheckInDate === todayStr;

            const myNameStr = (settings.myName && String(settings.myName).trim() !== '') ? String(settings.myName) : '老婆';
            const partnerNameStr = (settings.partnerName && String(settings.partnerName).trim() !== '') ? String(settings.partnerName) : '老公';

            const myAvatarImg = settings.myAvatar ? `<img src="${settings.myAvatar}" style="width:100%;height:100%;object-fit:cover;">` : '<svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>';
            const partnerAvatarImg = settings.partnerAvatar ? `<img src="${settings.partnerAvatar}" style="width:100%;height:100%;object-fit:cover;">` : '<svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>';

            container.innerHTML = `
                <div style="padding: 12px; display: flex; flex-direction: column; gap: 12px; height: 100%;" autocomplete="off">
                    <div style="border:1px solid var(--border-color); padding:16px; border-radius:12px; background:var(--bg-color); display:flex; flex-direction:column; justify-content:space-between; height:150px; flex-shrink:0;">
                        <div style="display:flex; align-items:center; justify-content:center; gap:20px;">
                            <div style="display:flex; align-items:center;">
                                <div style="width:72px; height:72px; border-radius:50%; border:2px solid var(--border-color); overflow:hidden; background:var(--app-icon-bg); display:flex; align-items:center; justify-content:center; position:relative; z-index:2;">${myAvatarImg}</div>
                                <div style="width:72px; height:72px; border-radius:50%; border:2px solid var(--border-color); overflow:hidden; background:var(--app-icon-bg); display:flex; align-items:center; justify-content:center; position:relative; left:-24px; z-index:1;">${partnerAvatarImg}</div>
                            </div>
                            <div style="display:flex; flex-direction:column; gap:8px;">
                                <button class="btn" style="padding:6px 14px; font-size:12px; background:${myChecked ? '#829e8d' : 'var(--text-color)'}; color:#fff; border-radius:16px;" onclick="handleMyCheckIn()">
                                    ${myChecked ? `${myNameStr}今日已打卡` : `${myNameStr}今日未打卡`}
                                </button>
                                <button class="btn" style="padding:6px 14px; font-size:12px; background:${partnerChecked ? '#829e8d' : 'var(--sub-text)'}; color:#fff; border-radius:16px; cursor:default;" disabled>
                                    ${partnerChecked ? `${partnerNameStr}今日已打卡` : `${partnerNameStr}今日未打卡`}
                                </button>
                            </div>
                        </div>
                        <div style="text-align:center; font-size:12px; color:var(--sub-text);">
                            已共同打卡 <strong style="color:var(--text-color); font-size:13px;">${annivCheckInData.totalDays}</strong> 天
                        </div>
                    </div>

                    <form autocomplete="off" onsubmit="return false;" style="display:flex; flex-direction:column; gap:6px;">
                        <input type="text" id="annivName" placeholder="名称（如：相识纪念日 / 生日）" autocomplete="off" autocapitalize="off" spellcheck="false" name="no-autofill-name">
                        <input type="date" id="annivDate" autocomplete="off" name="no-autofill-date">
                        <button class="btn" style="width:100%; margin-top:2px;" onclick="addAnniversary()">保存良辰</button>
                    </form>
                    <div style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; margin-bottom:20px;" id="anniversaryContainer"></div>
                </div>
            `;
            updateAnniversaryList();
        }

        function addAnniversary() {
            const nameEl = document.getElementById('annivName');
            const dateEl = document.getElementById('annivDate');
            if (!nameEl || !dateEl) return;
            
            const name = nameEl.value.trim();
            const date = dateEl.value;
            if (!name || !date) {
                alert('请填写完整的名字和日期！');
                return;
            }
            anniversaries.push({ id: Date.now(), name, date });
            saveData();
            initAnniversary(document.getElementById('subPageContent'));
        }

        function editAnniversary(id) {
            const item = anniversaries.find(a => a.id === id);
            if (!item) return;
            const newName = prompt('修改名称：', item.name);
            if (newName === null) return;
            const newDate = prompt('修改日期 (YYYY-MM-DD)：', item.date);
            if (newDate === null) return;

            item.name = newName.trim() || item.name;
            item.date = newDate.trim() || item.date;
            saveData();
            initAnniversary(document.getElementById('subPageContent'));
        }

        function deleteAnniversary(id) {
            if (confirm("确定要删除这个良辰纪念日吗？")) {
                anniversaries = anniversaries.filter(a => a.id !== id);
                saveData();
                initAnniversary(document.getElementById('subPageContent'));
            }
        }

        function updateAnniversaryList() {
            const container = document.getElementById('anniversaryContainer');
            if (!container) return;
            container.innerHTML = '';

            const now = new Date();
            const yyyy = now.getFullYear();
            const todayTime = new Date(yyyy, now.getMonth(), now.getDate()).getTime();

            anniversaries.forEach((item, index) => {
                const parts = item.date.split('-').map(Number);
                const targetTime = new Date(parts[0], parts[1] - 1, parts[2]).getTime();

                let label = '还剩';
                let diffDays = 0;

                const isAbsolutePast = targetTime < todayTime && (yyyy - parts[0] > 1 || item.name.includes('纪念日'));

                if (isAbsolutePast) {
                    label = '已过去';
                    diffDays = Math.round((todayTime - targetTime) / (1000 * 60 * 60 * 24));
                } else {
                    let currentYearTargetTime = new Date(yyyy, parts[1] - 1, parts[2]).getTime();

                    if (currentYearTargetTime === todayTime) {
                        label = '就是';
                        diffDays = 0;
                    } else if (currentYearTargetTime < todayTime) {
                        label = '已过去';
                        diffDays = Math.round((todayTime - currentYearTargetTime) / (1000 * 60 * 60 * 24));
                    } else {
                        label = '还剩';
                        diffDays = Math.round((currentYearTargetTime - todayTime) / (1000 * 60 * 60 * 24));
                    }
                }

                const div = document.createElement('div');
                div.className = 'anniv-item-card';
                div.dataset.index = index;

                div.innerHTML = `
                    <div style="flex:1; overflow:hidden; padding-right:8px;">
                        <div style="font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.name}</div>
                        <div style="font-size:11px; color:var(--sub-text); margin-top:2px;">日期：${item.date}</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <div style="font-size:14px; text-align:right;">${label}<br><strong style="font-size:16px;">${diffDays}</strong> 天</div>
                        <button class="btn" style="padding:4px 6px; font-size:11px; background:none; border:1px solid var(--border-color); color:var(--text-color); cursor:pointer;" onclick="editAnniversary(${item.id})">修改</button>
                        <button class="btn" style="padding:4px 6px; font-size:11px; background:none; border:1px solid var(--border-color); color:var(--text-color); cursor:pointer;" onclick="deleteAnniversary(${item.id})">删除</button>
                        <div class="drag-handle" title="按住拖动排序">☰</div>
                    </div>
                `;

                const handle = div.querySelector('.drag-handle');
                let draggingEl = null;

                handle.addEventListener('touchstart', (e) => {
                    draggingEl = div;
                    div.classList.add('dragging');
                }, {passive: true});

                div.addEventListener('touchmove', (e) => {
                    if (!draggingEl) return;
                    e.preventDefault();
                    const currentY = e.touches[0].clientY;
                    const siblings = [...container.querySelectorAll('.anniv-item-card:not(.dragging)')];
                    const nextSibling = siblings.find(sibling => {
                        const box = sibling.getBoundingClientRect();
                        return currentY < box.top + box.height / 2;
                    });
                    if (nextSibling) {
                        container.insertBefore(draggingEl, nextSibling);
                    } else {
                        container.appendChild(draggingEl);
                    }
                }, {passive: false});

                div.addEventListener('touchend', () => {
                    if (draggingEl) {
                        draggingEl.classList.remove('dragging');
                        draggingEl = null;
                        syncDomOrderToAnniversaries(container);
                    }
                });

                handle.addEventListener('mousedown', (e) => {
                    div.draggable = true;
                });

                div.addEventListener('dragstart', (e) => {
                    div.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                });

                div.addEventListener('dragend', () => {
                    div.draggable = false;
                    div.classList.remove('dragging');
                    syncDomOrderToAnniversaries(container);
                });

                div.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    const draggingItem = container.querySelector('.dragging');
                    if (!draggingItem || draggingItem === div) return;
                    const box = div.getBoundingClientRect();
                    const offset = e.clientY - box.top - box.height / 2;
                    if (offset < 0) {
                        container.insertBefore(draggingItem, div);
                    } else {
                        container.insertBefore(draggingItem, div.nextSibling);
                    }
                });

                container.appendChild(div);
            });
        }

        function syncDomOrderToAnniversaries(container) {
            const newOrder = [];
            container.querySelectorAll('.anniv-item-card').forEach(card => {
                const oldIndex = Number(card.dataset.index);
                newOrder.push(anniversaries[oldIndex]);
            });
            anniversaries = newOrder;
            saveData();
            updateAnniversaryList();
        }

        // --- 设置模块 ---
        function initSettings(container) {
            container.innerHTML = `
                <div style="padding: 12px; display: flex; flex-direction: column; gap: 12px; height: 100%;">
                    <div class="setting-group">
                        <div class="setting-label">我的名字</div>
                        <input type="text" id="set_myName" value="${tempSettings.myName || ''}">
                    </div>
                    <div class="setting-group">
                        <div class="setting-label">对方名字</div>
                        <input type="text" id="set_partnerName" value="${tempSettings.partnerName || ''}">
                    </div>
                    <div class="setting-group">
                        <div class="setting-label">我的头像</div>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <input type="file" accept="image/*" onchange="compressAndStoreImage(event, 'myAvatar')" style="flex:1;">
                        </div>
                        <div id="myAvatarPreviewArea" style="margin-top:6px;"></div>
                    </div>
                    <div class="setting-group">
                        <div class="setting-label">对方头像</div>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <input type="file" accept="image/*" onchange="compressAndStoreImage(event, 'partnerAvatar')" style="flex:1;">
                        </div>
                        <div id="partnerAvatarPreviewArea" style="margin-top:6px;"></div>
                    </div>
                    <div class="setting-group">
                        <div class="setting-label">聊天背景图</div>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <input type="file" accept="image/*" onchange="compressAndStoreImage(event, 'chatBg')" style="flex:1;">
                        </div>
                        <div id="chatBgPreviewArea" style="margin-top:6px;"></div>
                    </div>

                    <div class="setting-group">
                        <div class="setting-label">对方回复时间范围 (秒)</div>
                        <div style="display:flex; align-items:center; gap:8px; font-size:12px;">
                            <span>最小秒数：</span>
                            <input type="number" id="set_replyDelayMin" value="${tempSettings.replyDelayMin || '5'}" min="1" max="600" style="flex:1;">
                            <span>最大秒数 (最高600秒/10分钟)：</span>
                            <input type="number" id="set_replyDelayMax" value="${tempSettings.replyDelayMax || '30'}" min="1" max="600" style="flex:1;">
                        </div>
                    </div>

                    <div class="setting-group">
                        <div class="setting-label">🎨 聊天气泡颜色自定义</div>
                        <div style="display:flex; flex-direction:column; gap:6px; font-size:12px;">
                            <div style="display:flex; align-items:center; justify-content:space-between;">
                                <span>我的气泡背景色：</span>
                                <input type="color" id="set_myBubbleBg" value="${tempSettings.myBubbleBg || '#111111'}" style="width:60px; height:32px; padding:0; border:none; cursor:pointer;">
                            </div>
                            <div style="display:flex; align-items:center; justify-content:space-between;">
                                <span>我的气泡文字色：</span>
                                <input type="color" id="set_myBubbleText" value="${tempSettings.myBubbleText || '#ffffff'}" style="width:60px; height:32px; padding:0; border:none; cursor:pointer;">
                            </div>
                            <div style="display:flex; align-items:center; justify-content:space-between;">
                                <span>对方气泡背景色：</span>
                                <input type="color" id="set_partnerBubbleBg" value="${tempSettings.partnerBubbleBg || '#eaeaea'}" style="width:60px; height:32px; padding:0; border:none; cursor:pointer;">
                            </div>
                            <div style="display:flex; align-items:center; justify-content:space-between;">
                                <span>对方气泡文字色：</span>
                                <input type="color" id="set_partnerBubbleText" value="${tempSettings.partnerBubbleText || '#111111'}" style="width:60px; height:32px; padding:0; border:none; cursor:pointer;">
                            </div>
                            <button class="btn" style="padding:4px 8px; font-size:11px; margin-top:4px; background:none; border:1px solid var(--border-color); color:var(--text-color);" onclick="resetBubbleColors()">恢复默认气泡颜色</button>
                        </div>
                    </div>

                    <div class="setting-group">
                        <div class="setting-label">✨ 心情栏颜色自定义</div>
                        <div style="display:flex; flex-direction:column; gap:6px; font-size:12px;">
                            <div style="display:flex; align-items:center; justify-content:space-between;">
                                <span>心情栏背景色 (支持半透明)：</span>
                                <input type="text" id="set_moodBgColor" value="${tempSettings.moodBgColor || 'rgba(255, 255, 255, 0.65)'}" style="flex:1; margin-left:10px;">
                            </div>
                            <div style="display:flex; align-items:center; justify-content:space-between;">
                                <span>心情栏文字颜色：</span>
                                <input type="color" id="set_moodTextColor" value="${tempSettings.moodTextColor || '#666666'}" style="width:60px; height:32px; padding:0; border:none; cursor:pointer;">
                            </div>
                            <button class="btn" style="padding:4px 8px; font-size:11px; margin-top:4px; background:none; border:1px solid var(--border-color); color:var(--text-color);" onclick="resetMoodColors()">恢复默认心情栏颜色</button>
                        </div>
                    </div>

                    <div class="setting-group">
                        <div class="setting-label">数据恢复与备份</div>
                        <div style="display:flex; gap:8px;">
                            <button class="btn" style="flex:1; background:none; border:1px solid var(--border-color); color:var(--text-color);" onclick="exportData()">手动导出备份</button>
                            <button class="btn" style="flex:1; background:none; border:1px solid var(--border-color); color:var(--text-color);" onclick="document.getElementById('importFile').click()">导入备份恢复</button>
                            <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
                        </div>
                    </div>

                    <div style="display:flex; gap:10px; margin-top:10px; margin-bottom:20px;">
                        <button class="btn" style="flex:1; background-color:#333333; color:#ffffff;" onclick="saveSettingsChanges()">保存修改</button>
                        <button class="btn" style="flex:1; background-color:transparent; border:1px solid var(--border-color); color:var(--sub-text);" onclick="cancelSettingsChanges()">取消修改</button>
                    </div>
                </div>
            `;
            renderAvatarPreviews();
        }

        function resetBubbleColors() {
            tempSettings.myBubbleBg = '';
            tempSettings.myBubbleText = '';
            tempSettings.partnerBubbleBg = '';
            tempSettings.partnerBubbleText = '';
            document.getElementById('set_myBubbleBg').value = '#111111';
            document.getElementById('set_myBubbleText').value = '#ffffff';
            document.getElementById('set_partnerBubbleBg').value = '#eaeaea';
            document.getElementById('set_partnerBubbleText').value = '#111111';
        }

        function resetMoodColors() {
            tempSettings.moodBgColor = '';
            tempSettings.moodTextColor = '';
            document.getElementById('set_moodBgColor').value = 'rgba(255, 255, 255, 0.65)';
            document.getElementById('set_moodTextColor').value = '#666666';
        }

        function renderAvatarPreviews() {
            renderSingleAvatarPreview('myAvatar', 'myAvatarPreviewArea');
            renderSingleAvatarPreview('partnerAvatar', 'partnerAvatarPreviewArea');
            renderSingleAvatarPreview('chatBg', 'chatBgPreviewArea');
        }

        function renderSingleAvatarPreview(key, areaId) {
            const area = document.getElementById(areaId);
            if (!area) return;
            area.innerHTML = '';
            if (!tempSettings[key]) {
                area.innerHTML = `<span style="font-size:11px; color:var(--sub-text);">暂无图片</span>`;
                return;
            }
            const wrap = document.createElement('div');
            wrap.style.cssText = key === 'chatBg' ? "position:relative; width:80px; height:52px;" : "position:relative; width:52px; height:52px;";
            wrap.innerHTML = `
                <img src="${tempSettings[key]}" style="width:100%; height:100%; object-fit:cover; border-radius:8px; border:1px solid var(--border-color);">
                <button onclick="clearSettingImage('${key}')" style="position:absolute; top:-6px; right:-6px; width:18px; height:18px; background:rgba(0,0,0,0.5); color:#fff; border:none; border-radius:50%; font-size:11px; display:flex; align-items:center; justify-content:center; cursor:pointer;">×</button>
            `;
            area.appendChild(wrap);
        }

        function clearSettingImage(key) {
            tempSettings[key] = '';
            renderAvatarPreviews();
        }

        function compressAndStoreImage(event, targetKey) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1200;
                    const MAX_HEIGHT = 1200;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    tempSettings[targetKey] = canvas.toDataURL('image/jpeg', 0.95);
                    renderAvatarPreviews();
                }
            };
            reader.readAsDataURL(file);
        }

        function saveSettingsChanges() {
            const mName = document.getElementById('set_myName');
            const pName = document.getElementById('set_partnerName');
            const dMin = document.getElementById('set_replyDelayMin');
            const dMax = document.getElementById('set_replyDelayMax');
            const mbBg = document.getElementById('set_myBubbleBg');
            const mbText = document.getElementById('set_myBubbleText');
            const pbBg = document.getElementById('set_partnerBubbleBg');
            const pbText = document.getElementById('set_partnerBubbleText');
            const mBg = document.getElementById('set_moodBgColor');
            const mText = document.getElementById('set_moodTextColor');

            if(mName) tempSettings.myName = mName.value.trim();
            if(pName) tempSettings.partnerName = pName.value.trim();
            if(dMin) tempSettings.replyDelayMin = dMin.value.trim();
            if(dMax) tempSettings.replyDelayMax = dMax.value.trim();
            if(mbBg) tempSettings.myBubbleBg = mbBg.value;
            if(mbText) tempSettings.myBubbleText = mbText.value;
            if(pbBg) tempSettings.partnerBubbleBg = pbBg.value;
            if(pbText) tempSettings.partnerBubbleText = pbText.value;
            if(mBg) tempSettings.moodBgColor = mBg.value.trim();
            if(mText) tempSettings.moodTextColor = mText.value;

            settings.myName = tempSettings.myName;
            settings.partnerName = tempSettings.partnerName;
            settings.replyDelayMin = tempSettings.replyDelayMin;
            settings.replyDelayMax = tempSettings.replyDelayMax;
            settings.myAvatar = tempSettings.myAvatar;
            settings.partnerAvatar = tempSettings.partnerAvatar;
            settings.chatBg = tempSettings.chatBg;
            settings.myBubbleBg = tempSettings.myBubbleBg;
            settings.myBubbleText = tempSettings.myBubbleText;
            settings.partnerBubbleBg = tempSettings.partnerBubbleBg;
            settings.partnerBubbleText = tempSettings.partnerBubbleText;
            settings.moodBgColor = tempSettings.moodBgColor;
            settings.moodTextColor = tempSettings.moodTextColor;

            saveData();
            alert('保存成功！');
            closeApp();
        }

        function cancelSettingsChanges() {
            tempSettings = JSON.parse(JSON.stringify(settings));
            alert('已取消修改。');
            closeApp();
        }

        function exportData() {
            const backupData = { cardLibrary, actionLibrary, chatMessages, letters, anniversaries, heartMoments, settings, annivCheckInData };
            const jsonString = JSON.stringify(backupData, null, 2);
            
            const blob = new Blob([jsonString], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const downloadAnchor = document.createElement('a');
            downloadAnchor.href = url;
            downloadAnchor.download = `Sanemi_Backup_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            document.body.removeChild(downloadAnchor);
            URL.revokeObjectURL(url);
            
            alert('备份已生成！在弹出的提示中点击“下载”后，文件会自动保存在手机自带的【文件 (Files)】App 中的【下载 (Downloads)】或【iCloud 云盘】文件夹里哦！');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.cardLibrary) cardLibrary = imported.cardLibrary;
                    if (imported.actionLibrary) actionLibrary = imported.actionLibrary;
                    if (imported.chatMessages) chatMessages = imported.chatMessages;
                    if (imported.letters) letters = imported.letters;
                    if (imported.anniversaries) anniversaries = imported.anniversaries;
                    if (imported.heartMoments) heartMoments = imported.heartMoments;
                    if (imported.settings) settings = imported.settings;
                    if (imported.annivCheckInData) annivCheckInData = imported.annivCheckInData;
                    saveData();
                    alert('数据恢复同步成功！');
                    location.reload();
                } catch (err) {
                    alert('导入失败，文件格式错误！');
                }
            };
            reader.readAsText(file);
        }

        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;
        themeToggle.onclick = () => {
            if (htmlElement.getAttribute('data-theme') === 'dark') {
                htmlElement.removeAttribute('data-theme');
            } else {
                htmlElement.setAttribute('data-theme', 'dark');
            }
        };
    </script>
</body>
</html>
