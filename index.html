                        <div style="cursor:pointer; display:flex; align-items:center; justify-content:center; width:44px; height:44px; position:relative;" onclick="spawnOverflowingBubbles(event)" title="点一点缓缓冒泡">
                            <svg viewBox="0 0 24 24" width="30" height="30" stroke="#ffb6c1" stroke-width="2" fill="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                        </div>
                        <div class="avatar-box" style="width:81.6px; height:81.6px; border-radius:50%;">${myAvatarImg}</div>
                    </div>

                    <div>
                        <textarea id="heartInput" placeholder="分享此刻的心情或动态..."></textarea>
                        <div id="heartImgPreviewBox" style="margin-top:6px;"></div>
                        <div style="display:flex; gap:8px; margin-top:6px;">
                            <button class="btn" style="flex:1; background:none; border:1px solid var(--border-color); color:var(--text-color); font-size:12px;" onclick="document.getElementById('localImgInput').click()">选择配图</button>
                            <input type="file" id="localImgInput" style="display:none" accept="image/*" onchange="pickLocalImage(event)">
                            <button class="btn" style="flex:1; font-size:12px;" onclick="postUserHeartMoment()">发布新动态</button>
                        </div>
                    </div>
                    <div style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; margin-top:4px;" id="heartMomentsList"></div>
                </div>
            `;
            renderHeartMomentsList();
        }

        function checkAndProcessPendingHeartInteractions() {
            const now = Date.now();
            const partnerNameStr = settings.partnerName || '老公';
            let updated = false;

            heartMoments.forEach(m => {
                const momentAge = now - m.id;

                if (!m.requiredDelayMs) {
                    const randomMinutes = Math.random() * (30 - 3) + 3;
                    m.requiredDelayMs = Math.floor(randomMinutes * 60 * 1000);
                }

                if (m.author === 'user') {
                    const hasLiked = m.likes && m.likes.includes(partnerNameStr);
                    const hasReplied = m.comments && m.comments.some(c => c.author === partnerNameStr);

                    if ((!hasLiked || !hasReplied) && momentAge >= m.requiredDelayMs) {
                        if (!hasLiked) {
                            m.likes.push(partnerNameStr);
                        }
                        if (!hasReplied) {
                            m.comments.push({
                                id: m.id + 100,
                                author: partnerNameStr,
                                text: getRandomCardSentences(),
                                replies: [],
                                requiredDelayMs: m.requiredDelayMs
                            });
                        }
                        updated = true;
                    }
                }

                if (m.comments && m.comments.length > 0) {
                    m.comments.forEach(com => {
                        const comAge = now - com.id;
                        if (!com.requiredDelayMs) {
                            com.requiredDelayMs = Math.floor((Math.random() * (30 - 3) + 3) * 60 * 1000);
                        }
                        const hasSubReply = com.replies && com.replies.some(r => r.author === partnerNameStr);
                        if (com.author !== partnerNameStr && !hasSubReply && comAge >= com.requiredDelayMs) {
                            com.replies.push({
                                id: Date.now(),
                                author: partnerNameStr,
                                text: getRandomCardSentences(),
                                requiredDelayMs: com.requiredDelayMs
                            });
                            updated = true;
                        }
                    });
                }
            });

            if (updated) saveData();
        }

        function pickLocalImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1200;
                    const MAX_HEIGHT = 1200;
                    let width = img.width;
                    let height = img.height;
                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    selectedHeartImg = canvas.toDataURL('image/jpeg', 0.9);

                    const box = document.getElementById('heartImgPreviewBox');
                    if(box) {
                        box.innerHTML = `
                            <div style="position:relative; width:60px; height:60px; display:inline-block;">
                                <img src="${selectedHeartImg}" style="width:100%; height:100%; object-fit:cover; border-radius:6px; border:1px solid var(--border-color);">
                                <button onclick="clearHeartImage()" style="position:absolute; top:-4px; right:-4px; width:16px; height:16px; background:rgba(0,0,0,0.5); color:#fff; border:none; border-radius:50%; font-size:10px; cursor:pointer;">×</button>
                            </div>
                        `;
                    }
                }
            };
            reader.readAsDataURL(file);
        }

        function clearHeartImage() {
            selectedHeartImg = '';
            const box = document.getElementById('heartImgPreviewBox');
            if(box) box.innerHTML = '';
        }

        function spawnOverflowingBubbles(e) {
            const box = document.getElementById('heartHeaderBox');
            if(!box) return;
            const rect = box.getBoundingClientRect();
            for(let i=0; i<15; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'pink-bubble';
                const randomX = Math.random() * (rect.width - 40) + 20;
                bubble.style.left = randomX + 'px';
                bubble.style.bottom = '4px';
                bubble.style.animationDuration = (2.4 + Math.random() * 1.0) + 's';
                bubble.style.animationDelay = (Math.random() * 0.3) + 's';
                box.appendChild(bubble);
                setTimeout(() => bubble.remove(), 3800);
            }
        }

        function getRandomCardSentences() {
            if (cardLibrary.length === 0) return '今天心情很好。';
            const count = Math.min(cardLibrary.length, Math.floor(Math.random() * 3) + 1);
            let tempLib = [...cardLibrary];
            let selected = [];
            for (let i = 0; i < count; i++) {
                const idx = Math.floor(Math.random() * tempLib.length);
                selected.push(tempLib[idx].content);
                tempLib.splice(idx, 1);
            }
            return selected.join(' ');
        }

        function postUserHeartMoment() {
            const input = document.getElementById('heartInput');
            if(!input) return;
            const text = input.value.trim();
            if (!text && !selectedHeartImg) {
                alert('请至少输入文字或选择一张图片！');
                return;
            }

            const d = new Date();
            const timeStr = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            const dateStr = d.toISOString().slice(0, 10);
            const assignedDelayMs = Math.floor((Math.random() * (30 - 3) + 3) * 60 * 1000);

            const newMoment = {
                id: Date.now(),
                uniqueBatchId: `user_${Date.now()}`,
                author: 'user',
                content: text,
                image: selectedHeartImg,
                time: timeStr,
                dateStr: dateStr,
                likes: [],
                comments: [],
                isPinned: false,
                requiredDelayMs: assignedDelayMs
            };

            heartMoments.unshift(newMoment);
            input.value = '';
            selectedHeartImg = '';
            const previewBox = document.getElementById('heartImgPreviewBox');
            if(previewBox) previewBox.innerHTML = '';

            saveData();
            renderHeartMomentsList();
        }

        function renderHeartMomentsList() {
            checkAndProcessPendingHeartInteractions();
            const listEl = document.getElementById('heartMomentsList');
            if (!listEl) return;
            listEl.innerHTML = '';

            if (heartMoments.length === 0) {
                listEl.innerHTML = `<div style="text-align:center; color:var(--sub-text); font-size:13px; padding:20px;">暂无心迹动态，快来发布第一条吧~</div>`;
                return;
            }

            let sortedMoments = [...heartMoments].sort((a, b) => (b.isPinned ? 1 : 0) - (a.isPinned ? 1 : 0));
            const myNameStr = settings.myName || '我';
            const partnerNameStr = settings.partnerName || '老公';

            sortedMoments.forEach(moment => {
                const authorName = moment.author === 'user' ? myNameStr : partnerNameStr;
                const authorAvatar = moment.author === 'user' ? settings.myAvatar : settings.partnerAvatar;

                const card = document.createElement('div');
                card.style.cssText = `border:1px solid var(--border-color); padding:10px; border-radius:8px; background:var(--bg-color); display:flex; flex-direction:column; gap:6px; ${moment.isPinned ? 'border-color: var(--pine-green);' : ''}`;
                
                let pinTag = moment.isPinned ? `<span style="font-size:10px; background:var(--pine-green); color:#fff; padding:1px 4px; border-radius:4px; margin-right:4px;">置顶</span>` : '';

                let headerHTML = `
                    <div style="display:flex; align-items:center; gap:8px;">
                        <div class="avatar-box" style="width:28px;height:28px;">
                            ${authorAvatar ? `<img src="${authorAvatar}">` : '<svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>'}
                        </div>
                        <div style="flex:1; font-weight:bold; font-size:15px; display:flex; align-items:center; color:var(--text-color);">${pinTag}${authorName}</div>
                        <div style="font-size:10px; color:var(--sub-text);">${moment.time}</div>
                    </div>
                `;

                let textHTML = moment.content ? `<div style="font-size:var(--font-size); word-break:break-all; padding-left:36px;">${moment.content}</div>` : '';
                let imgHTML = moment.image ? `<div style="padding-left:36px; margin-top:4px;"><img src="${moment.image}" style="max-width:140px; max-height:140px; border-radius:6px; border:1px solid var(--border-color); object-fit:cover;"></div>` : '';

                let likesHTML = '';
                if (moment.likes && moment.likes.length > 0) {
                    likesHTML = `<div style="font-size:11px; color:var(--pine-green); padding-left:36px; margin-top:4px;">❤️ ${moment.likes.join(', ')} 觉得很赞</div>`;
                }

                let commentsHTML = `<div style="display:flex; flex-direction:column; gap:4px; padding-left:36px; margin-top:4px; max-height: 160px; overflow-y: auto;">`;
                if (moment.comments && moment.comments.length > 0) {
                    moment.comments.forEach(com => {
                        let repliesListHTML = '';
                        if (com.replies && com.replies.length > 0) {
                            com.replies.forEach(rep => {
                                repliesListHTML += `<div style="font-size:var(--font-size); line-height:1.4; margin-top:2px; color:var(--text-color); cursor:pointer;" onclick="replyToComment(${moment.id}, ${com.id}, '${rep.author}')"><strong style="color:var(--sub-text); font-weight:bold;">${rep.author}:</strong> ${rep.text}</div>`;
                            });
                        }
                        commentsHTML += `
                            <div style="font-size:var(--font-size); line-height:1.4; background:rgba(120,120,120,0.06); padding:6px; border-radius:6px;">
                                <div style="cursor:pointer;" onclick="replyToComment(${moment.id}, ${com.id}, '${com.author}')">
                                    <strong style="font-weight:bold;">${com.author}:</strong> ${com.text}
                                </div>
                                ${repliesListHTML}
                            </div>
                        `;
                    });
                }
                commentsHTML += `</div>`;

                let pinBtnText = moment.isPinned ? '取消置顶' : '置顶';
                let actionHTML = `
                    <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:4px;">
                        <button class="btn" style="padding:2px 8px; font-size:11px; background:none; border:1px solid var(--border-color); color:var(--text-color);" onclick="togglePinMoment(${moment.id})">${pinBtnText}</button>
                        <button class="btn" style="padding:2px 8px; font-size:11px; background:none; border:1px solid var(--border-color); color:var(--text-color);" onclick="likeMoment(${moment.id})">点赞</button>
                        <button class="btn" style="padding:2px 8px; font-size:11px; background:none; border:1px solid var(--border-color); color:var(--text-color);" onclick="commentMoment(${moment.id})">评论</button>
                        <button class="btn" style="padding:2px 8px; font-size:11px; background:none; border:1px solid var(--border-color); color:var(--text-color);" onclick="deleteMoment(${moment.id})">删除</button>
                    </div>
                `;

                card.innerHTML = headerHTML + textHTML + imgHTML + likesHTML + commentsHTML + actionHTML;
                listEl.appendChild(card);
            });
        }

        function togglePinMoment(momentId) {
            const moment = heartMoments.find(m => m.id === momentId);
            if (!moment) return;
            moment.isPinned = !moment.isPinned;
            saveData();
            renderHeartMomentsList();
        }

        function deleteMoment(momentId) {
            if (confirm("确定要删除这条心迹吗？")) {
                const moment = heartMoments.find(m => m.id === momentId);
                if (moment && moment.uniqueBatchId) {
                    let deletedList = JSON.parse(localStorage.getItem('deletedHeartBatches') || '[]');
                    if (!deletedList.includes(moment.uniqueBatchId)) {
                        deletedList.push(moment.uniqueBatchId);
                        localStorage.setItem('deletedHeartBatches', JSON.stringify(deletedList));
                    }
                }
                heartMoments = heartMoments.filter(m => m.id !== momentId);
                saveData();
                renderHeartMomentsList();
            }
        }

        function likeMoment(momentId) {
            const moment = heartMoments.find(m => m.id === momentId);
            if (!moment) return;
            const myNameStr = settings.myName || '我';
            if (!moment.likes.includes(myNameStr)) {
                moment.likes.push(myNameStr);
                saveData();
                renderHeartMomentsList();
            }
        }

        function commentMoment(momentId) {
            const moment = heartMoments.find(m => m.id === momentId);
            if (!moment) return;
            
            let overlay = document.getElementById('loveCustomModal');
            if(overlay) overlay.remove();

            overlay = document.createElement('div');
            overlay.id = 'loveCustomModal';
            overlay.className = 'love-modal-overlay';
            const partnerNameStr = settings.partnerName || '老公';

            overlay.innerHTML = `
                <div class="love-modal-card" style="width: 90%; max-width: 320px; text-align: left;">
                    <div style="font-size: 15px; font-weight: bold; margin-bottom: 4px;">回复 ${partnerNameStr}：</div>
                    <textarea id="heartCommentInputText" placeholder="写下你的评论..." style="height: 220px; min-height: 200px; resize: none;"></textarea>
                    <div class="love-modal-buttons">
                        <button class="btn" style="flex:1; background:var(--bg-color); color:var(--text-color); border:1px solid var(--border-color); border-radius:10px;" onclick="closeLoveModal()">取消</button>
                        <button class="btn" style="flex:1; border-radius:10px; background:var(--pine-green); color:#fff;" onclick="confirmPostComment(${momentId})">好</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            setTimeout(() => {
                const inp = document.getElementById('heartCommentInputText');
                if(inp) inp.focus();
            }, 100);
        }

        function confirmPostComment(momentId) {
            const inp = document.getElementById('heartCommentInputText');
            if(!inp) return;
            const text = inp.value.trim();
            if(!text) { alert('评论内容不能为空哦！'); return; }

            const moment = heartMoments.find(m => m.id === momentId);
            if (!moment) return;

            const myNameStr = settings.myName || '我';
            const assignedDelayMs = Math.floor((Math.random() * (30 - 3) + 3) * 60 * 1000);

            moment.comments.push({
                id: Date.now(),
                author: myNameStr,
                text: text,
                replies: [],
                requiredDelayMs: assignedDelayMs
            });
            saveData();
            closeLoveModal();
            renderHeartMomentsList();
        }

        function replyToComment(momentId, commentId, targetAuthor) {
            const moment = heartMoments.find(m => m.id === momentId);
            if (!moment) return;
            const comment = moment.comments.find(c => c.id === commentId);
            if (!comment) return;

            let overlay = document.getElementById('loveCustomModal');
            if(overlay) overlay.remove();

            overlay = document.createElement('div');
            overlay.id = 'loveCustomModal';
            overlay.className = 'love-modal-overlay';

            overlay.innerHTML = `
                <div class="love-modal-card" style="width: 90%; max-width: 320px; text-align: left;">
                    <div style="font-size: 15px; font-weight: bold; margin-bottom: 4px;">回复 ${targetAuthor}：</div>
                    <textarea id="heartSubCommentInputText" placeholder="写下你的回复..." style="height: 220px; min-height: 200px; resize: none;"></textarea>
                    <div class="love-modal-buttons">
                        <button class="btn" style="flex:1; background:var(--bg-color); color:var(--text-color); border:1px solid var(--border-color); border-radius:10px;" onclick="closeLoveModal()">取消</button>
                        <button class="btn" style="flex:1; border-radius:10px; background:var(--pine-green); color:#fff;" onclick="confirmPostSubComment(${momentId}, ${commentId})">好</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            setTimeout(() => {
                const inp = document.getElementById('heartSubCommentInputText');
                if(inp) inp.focus();
            }, 100);
        }

        function confirmPostSubComment(momentId, commentId) {
            const inp = document.getElementById('heartSubCommentInputText');
            if(!inp) return;
            const text = inp.value.trim();
            if(!text) { alert('回复内容不能为空哦！'); return; }

            const moment = heartMoments.find(m => m.id === momentId);
            if (!moment) return;
            const comment = moment.comments.find(c => c.id === commentId);
            if (!comment) return;

            const myNameStr = settings.myName || '我';
            const assignedDelayMs = Math.floor((Math.random() * (30 - 3) + 3) * 60 * 1000);

            comment.replies.push({
                id: Date.now(),
                author: myNameStr,
                text: text,
                requiredDelayMs: assignedDelayMs
            });
            saveData();
            closeLoveModal();
            renderHeartMomentsList();
        }

        // --- 字库模块 ---

        function updateCardList(filteredList = cardLibrary) {
            const listContainer = document.getElementById('itemContainer');
            const countEl = document.getElementById('cardCount');
            if(!listContainer || !countEl) return;
            countEl.innerText = filteredList.length;
            listContainer.innerHTML = '';
            
            filteredList.forEach(card => {
                const item = document.createElement('div');
                item.style.cssText = "border:1px solid var(--border-color); padding:10px; border-radius:8px; display:flex; justify-content:space-between; align-items:center; background:var(--bg-color);";
                item.innerHTML = `

        function uploadEmojisFromLib(event) {
            const files = event.target.files;
            if (!files.length) return;
            if(!settings.emojis) settings.emojis = [];
            
            let loadedCount = 0;
            for (let file of files) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        canvas.width = 150;
                        canvas.height = 150;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, 150, 150);
                        settings.emojis.push(canvas.toDataURL('image/jpeg', 0.8));
                        loadedCount++;
                        if (loadedCount === files.length) {
                            saveData();
                            updateEmojiList();
                            const fileInput = document.getElementById('emojiFileInput');
                            if (fileInput) fileInput.value = '';
                        }
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function checkAndGeneratePartnerInitiatedLetter() {
            const now = Date.now();
            let lastPartnerLetterTime = Number(localStorage.getItem('lastPartnerLetterTime')) || 0;
            
            if (!lastPartnerLetterTime) {
                lastPartnerLetterTime = now;
                localStorage.setItem('lastPartnerLetterTime', lastPartnerLetterTime);
            }

            const elapsed = now - lastPartnerLetterTime;
            const randomTargetInterval = (Math.random() * (168 - 72) + 72) * 60 * 60 * 1000;

            if (elapsed >= randomTargetInterval) {
                if (cardLibrary.length > 0) {
                    const count = Math.min(cardLibrary.length, Math.floor(Math.random() * (15 - 5 + 1)) + 5);
                    let selected = [];
                    let tempLib = [...cardLibrary];
                    for (let i = 0; i < count; i++) {
                        const idx = Math.floor(Math.random() * tempLib.length);
                        selected.push(tempLib[idx].content);
                        tempLib.splice(idx, 1);
                    }
                    const partnerLetterContent = selected.join(' ');

                    const d = new Date();
                    const timeStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

                    letters.push({
                        id: now,
                        isPartnerInitiated: true,
                        myLetter: '',
                        reply: partnerLetterContent,
                        time: timeStr,
                        estTime: '不久的将来',
                        replyTimestamp: now,
                        isRead: false,
                        partnerLetterTime: timeStr,
                        myReplyToPartner: '',
                        continuationReplies: []
                    });

                    localStorage.setItem('lastPartnerLetterTime', now);
                    saveData();
                }
            }
        }

        function checkAndSpawnFlyingEnvelope(container) {

                activeFlyingEnvelopeEl = null;

            const unreadReadyLetter = letters.find(item => {
                const isSentReady = !item.isPartnerInitiated && item.reply && !item.isRead;
                const isReceivedReady = item.isPartnerInitiated && (item.partnerReplyContent && !item.isRead || (!item.myReplyToPartner && !item.isRead));
                const isContinuationReady = item.continuationReplies && item.continuationReplies.some(cr => cr.replyContent && !item.isRead);
                return isSentReady || isReceivedReady || isContinuationReady;
            });

            if (!unreadReadyLetter) return;

            const badge = document.createElement('div');
            badge.className = 'flying-envelope-badge';
            badge.innerHTML = `

        function updateLettersList() {
            const container = document.getElementById('letterListContainer');
            if (!container) return;
            container.innerHTML = '';

            const now = Date.now();
            let hasNewUnread = false;

            letters.forEach(item => {
                if (!item.isPartnerInitiated && !item.reply && cardLibrary.length > 0 && now >= item.replyTimestamp) {
                    const count = Math.min(cardLibrary.length, Math.floor(Math.random() * (20 - 5 + 1)) + 5);
                    let selected = [];
                    let tempLib = [...cardLibrary];
                    for (let i = 0; i < count; i++) {
                        const idx = Math.floor(Math.random() * tempLib.length);
                        selected.push(tempLib[idx].content);
                        tempLib.splice(idx, 1);
                    }
                    item.reply = selected.join(' ');
                    
                    const d = new Date();
                    item.replyTime = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                    item.isRead = false;
                    saveData();
                }

                if (item.isPartnerInitiated && item.myReplyToPartner && !item.partnerReplyContent && cardLibrary.length > 0 && item.partnerReplyTimestamp && now >= item.partnerReplyTimestamp) {
                    const count = Math.min(cardLibrary.length, Math.floor(Math.random() * (20 - 5 + 1)) + 5);
                    let selected = [];
                    let tempLib = [...cardLibrary];
                    for (let i = 0; i < count; i++) {
                        const idx = Math.floor(Math.random() * tempLib.length);
                        selected.push(tempLib[idx].content);
                        tempLib.splice(idx, 1);
                    }
                    item.partnerReplyContent = selected.join(' ');
                    const d = new Date();
                    item.partnerReplyActualTime = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                    item.isRead = false;
                    saveData();
                }

                if (item.continuationReplies && item.continuationReplies.length > 0) {
                    item.continuationReplies.forEach(cr => {
                        if (!cr.replyContent && cardLibrary.length > 0 && cr.replyTimestamp && now >= cr.replyTimestamp) {
                            const count = Math.min(cardLibrary.length, Math.floor(Math.random() * (20 - 5 + 1)) + 5);
                            let selected = [];
                            let tempLib = [...cardLibrary];
                            for (let i = 0; i < count; i++) {
                                const idx = Math.floor(Math.random() * tempLib.length);
                                selected.push(tempLib[idx].content);
                                tempLib.splice(idx, 1);
                            }
                            cr.replyContent = selected.join(' ');
                            const d = new Date();
                            cr.replyTime = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                            item.isRead = false;
                            saveData();
                        }
                    });
                }

                if ((item.reply && !item.isRead && !item.isPartnerInitiated) ||
                    (item.isPartnerInitiated && (item.partnerReplyContent && !item.isRead || (!item.myReplyToPartner && !item.isRead))) ||
                    (item.continuationReplies && item.continuationReplies.some(cr => cr.replyContent && !item.isRead))) {
                    hasNewUnread = true;
                }
            });

            const filteredLetters = letters.filter(item => {
                if (currentLetterTab === 'sent') return !item.isPartnerInitiated;
                else return item.isPartnerInitiated;
            });

            const sortedLetters = [...filteredLetters].sort((a, b) => b.id - a.id);

            if (sortedLetters.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:var(--sub-text); font-size:13px; padding:20px;">暂无${currentLetterTab==='sent'?'寄出':'收到'}的信件记录</div>`;

                    topTimeText = `写信时间: ${item.partnerLetterTime || item.time}`;
                    
                    let partnerReplyHTML = '';
                    if (item.myReplyToPartner) {

                                <div style="margin-top:6px; padding-top:6px; border-top:1px dashed var(--border-color);">
                                    <div style="font-size:11px; color:var(--sub-text); margin-bottom:2px;">回信时间: ${item.partnerReplyActualTime || item.partnerEstTime}</div>
                                    <strong>他的回信：</strong>

                                </div>

                        } else {
                            partnerReplyHTML = `
                                <div style="margin-top:6px; padding-top:6px; border-top:1px dashed var(--border-color);">
                                    <div style="font-size:11px; color:var(--sub-text);">寄出时间: ${item.myReplyTime} | 预计回信时间: ${item.partnerEstTime || '不久的将来'}</div>
                                    <div style="margin-top:4px;"><strong>我的回信:</strong> ${item.myReplyToPartner}</div>
                                </div>

                    }

                    let replySection = item.myReplyToPartner ? partnerReplyHTML : `
                        <div style="margin-top:6px;">
                            <button class="btn" style="padding:4px 10px; font-size:11px;" onclick="replyToPartnerLetter(${item.id})">回复此信</button>

                    cardContentHTML = `
                        <div style="font-weight:bold; color:var(--text-color);">对方主动写给你的信</div>
                        <div style="border-top:1px dashed var(--border-color); padding-top:6px; max-height: 240px; overflow-y: auto; white-space: pre-wrap; color:var(--text-color);">${item.reply}</div>
                        ${replySection}
                    `;
                } else if (!item.reply) {

                    topTimeText = `寄出时间: ${item.time} | 预计回信时间: ${item.estTime || '不久的将来'}`;

        function deleteLetter(id) {

        // --- 4. 良辰模块 ---

            const todayStr = new Date().toISOString().slice(0, 10);
            if (annivCheckInData.partnerLastCheckInDate !== todayStr) {
                if (Math.random() < 0.65) {
                    annivCheckInData.partnerLastCheckInDate = todayStr;
                    if (annivCheckInData.myLastCheckInDate === todayStr) {
                        annivCheckInData.totalDays += 1;
                    }
                    saveData();

        function handleMyCheckIn() {
            const todayStr = new Date().toISOString().slice(0, 10);

                alert('今天已经打过卡啦！');
                return;

            annivCheckInData.myLastCheckInDate = todayStr;
            if (annivCheckInData.partnerLastCheckInDate === todayStr) {
                annivCheckInData.totalDays += 1;

            initAnniversary(document.getElementById('subPageContent'));

        function addAnniversary() {
            const nameEl = document.getElementById('annivName');
            const dateEl = document.getElementById('annivDate');
            if (!nameEl || !dateEl) return;
            
            const name = nameEl.value.trim();
            const date = dateEl.value;
            if (!name || !date) { alert('请填写完整的名字和日期！'); return; }
            anniversaries.push({ id: Date.now(), name, date });
            saveData();
            initAnniversary(document.getElementById('subPageContent'));
        }

        function editAnniversary(id) {
            const item = anniversaries.find(a => a.id === id);
            if (!item) return;
            const newName = prompt('修改名称：', item.name);
            if (newName === null) return;
            const newDate = prompt('修改日期 (YYYY-MM-DD)：', item.date);
            if (newDate === null) return;

            item.name = newName.trim() || item.name;
            item.date = newDate.trim() || item.date;
            saveData();
            initAnniversary(document.getElementById('subPageContent'));
        }

        function deleteAnniversary(id) {
            if (confirm("确定要删除这个良辰纪念日吗？")) {
                anniversaries = anniversaries.filter(a => a.id !== id);
                saveData();
                initAnniversary(document.getElementById('subPageContent'));
            }
        }

        function updateAnniversaryList() {
            const container = document.getElementById('anniversaryContainer');
            if (!container) return;
            container.innerHTML = '';

            const now = new Date();
            const yyyy = now.getFullYear();
            const todayTime = new Date(yyyy, now.getMonth(), now.getDate()).getTime();

            anniversaries.forEach((item) => {
                const parts = item.date.split('-').map(Number);
                const targetTime = new Date(parts[0], parts[1] - 1, parts[2]).getTime();

                let label = '还剩';
                let diffDays = 0;
                const isAbsolutePast = targetTime < todayTime && (yyyy - parts[0] > 1 || item.name.includes('纪念日'));

                if (isAbsolutePast) {
                    label = '已过去';
                    diffDays = Math.round((todayTime - targetTime) / (1000 * 60 * 60 * 24));
                } else {
                    let currentYearTargetTime = new Date(yyyy, parts[1] - 1, parts[2]).getTime();
                    if (currentYearTargetTime === todayTime) {
                        label = '就是';
                        diffDays = 0;
                    } else if (currentYearTargetTime < todayTime) {
                        label = '已过去';
                        diffDays = Math.round((todayTime - currentYearTargetTime) / (1000 * 60 * 60 * 24));
                    } else {
                        label = '还剩';
                        diffDays = Math.round((currentYearTargetTime - todayTime) / (1000 * 60 * 60 * 24));
                    }
                }

                const div = document.createElement('div');
                div.className = 'anniv-item-card';
                div.innerHTML = `
                    <div style="flex:1; overflow:hidden; padding-right:8px;">
                        <div style="font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.name}</div>
                        <div style="font-size:11px; color:var(--sub-text); margin-top:2px;">日期：${item.date}</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <div style="font-size:14px; text-align:right;">${label}<br><strong style="font-size:16px;">${diffDays}</strong> 天</div>
                        <button class="btn" style="padding:4px 6px; font-size:11px; background:none; border:1px solid var(--border-color); color:var(--text-color); cursor:pointer;" onclick="editAnniversary(${item.id})">修改</button>

                    </div>
                `;
                container.appendChild(div);
            });
        }

        // 回退至上一版本的呼吸球弹出星图逻辑
        function openUniverseModal() {
            let overlay = document.getElementById('universeModalOverlay');
            if(overlay) overlay.remove();

            const categories = ['学习', '工作', '运动', '娱乐', '共眠', '缱绻'];
            const categoryTotals = {};
            categories.forEach(cat => categoryTotals[cat] = 0);

            sishouRecords.forEach(rec => {
                categories.forEach(cat => {
                    if (rec.text.includes(cat)) {
                        categoryTotals[cat] += (rec.durationSeconds || 0);
                    }
                });
            });

            overlay = document.createElement('div');
            overlay.id = 'universeModalOverlay';
            overlay.className = 'universe-modal-overlay';
            overlay.onclick = (e) => {
                if(e.target === overlayModal || e.target === overlay) overlay.remove();
            };

            let nodesHTML = '';
            const radius = 65;
            categories.forEach((cat, idx) => {
                const angle = (idx / categories.length) * 2 * Math.PI - Math.PI / 2;
                const x = 90 + radius * Math.cos(angle) - 21;
                const y = 90 + radius * Math.sin(angle) - 21;
                
                nodesHTML += `
                    <div class="universe-star-node" style="left:${x}px; top:${y}px;" onclick="showCategoryTotalTime('${cat}', ${categoryTotals[cat]})">
                        <span>❤️</span>
                        <span>${cat}</span>
                    </div>
                `;
            });

            overlay.innerHTML = `
                <div class="universe-card" onclick="event.stopPropagation()">
                    <div style="font-size:15px; font-weight:bold;">夜夜流光相皎洁</div>
                    <div class="universe-circle-parent">

                    <button class="btn" style="width:100%; border-radius:10px; background:var(--pine-green); color:#fff;" onclick="document.getElementById('universeModalOverlay').remove()">关闭</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function showCategoryTotalTime(categoryName, totalSecs) {
            const partnerNameStr = settings.partnerName || '老公';
            const h = Math.floor(totalSecs / 3600);
            const m = Math.floor((totalSecs % 3600) / 60);
            const s = totalSecs % 60;

            let timeStr = '';
            if (h > 0) timeStr += `${h}小时`;
            if (m > 0 || h > 0) timeStr += `${m}分钟`;
            timeStr += `${s}秒`;
            if (totalSecs === 0) timeStr = '0秒';

            let overlay = document.createElement('div');
            overlay.className = 'love-modal-overlay';
            overlay.innerHTML = `
                <div class="love-modal-card">
                    <div class="love-modal-text">和${partnerNameStr}一起${categoryName}的总时长为${timeStr}</div>
                    <div class="love-modal-buttons">
                        <button class="btn" style="border-radius:10px; width:100%; background:var(--pine-green); color:#fff;" onclick="this.closest('.love-modal-overlay').remove()">好</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function openTimePickerModal(typeName) {

        function setupWheelListener(col) {
            const items = col.querySelectorAll('.picker-wheel-item');
            const updateSelection = () => {
                const scrollTop = col.scrollTop;
                const index = Math.round(scrollTop / 40);
                items.forEach((item, idx) => {
                    if(idx === index) item.classList.add('selected');
                    else item.classList.remove('selected');
                });
            };
            col.addEventListener('scroll', () => {
                requestAnimationFrame(updateSelection);
            }, {passive: true});
            updateSelection();
        }

        function confirmTimePicker(typeName) {
            const hCol = document.getElementById('pickerHours');
            const mCol = document.getElementById('pickerMins');
            let hours = 0, mins = 30;
            if(hCol) hours = Math.round(hCol.scrollTop / 40);
            if(mCol) mins = Math.round(mCol.scrollTop / 40);

            const totalSecs = (hours * 3600) + (mins * 60);
            if(totalSecs <= 0) { alert('请选择大于0分钟的时长！'); return; }
            if(totalSecs > 72 * 3600) { alert('倒计时不能超过72小时哦！'); return; }
            closeLoveModal();
            startSiShouSession(typeName, 'countdown', totalSecs);

        function startSiShouSession(typeName, mode, targetSecs) {
            sishouData = {
                active: true,
                type: typeName,
                mode: mode,
                startTime: Date.now(),
                targetSeconds: targetSecs,
                pausedSeconds: 0,
                isPaused: false
            };
            sishouSecondsElapsed = 0;
            sishouCountdownRemaining = targetSecs;
            saveData();
            updateSiShouActiveUI();
            startSiShouTicker();
        }

        function startSiShouTicker() {
            if(liveSiShouInterval) clearInterval(liveSiShouInterval);
            liveSiShouInterval = setInterval(() => {
                if(!sishouData.active || sishouData.isPaused) return;

                const now = Date.now();
                const diffSecs = Math.floor((now - sishouData.startTime) / 1000);

                if(sishouData.mode === 'countup') {
                    sishouSecondsElapsed = diffSecs; // 正计时无上限
                } else {
                    sishouCountdownRemaining = sishouData.targetSeconds - diffSecs;
                    if(sishouCountdownRemaining <= 0) {
                        sishouCountdownRemaining = 0;
                        updateSiShouDisplayTime();
                        finishSiShouSession('completed');
                        return;
                    }
                }
                updateSiShouDisplayTime();
            }, 1000);
        }

        function updateSiShouDisplayTime() {
            const displayEl = document.getElementById('sishouTimerClockBox');
            if(!displayEl) return;

            let targetSecs = sishouData.mode === 'countup' ? sishouSecondsElapsed : sishouCountdownRemaining;
            const hrs = String(Math.floor(targetSecs / 3600)).padStart(2,'0');
            const mins = String(Math.floor((targetSecs % 3600) / 60)).padStart(2,'0');
            const secs = String(targetSecs % 60).padStart(2,'0');
            displayEl.innerText = `${hrs}:${mins}:${secs}`;
        }

        function updateSiShouActiveUI() {
            const area = document.getElementById('sishouActiveArea');
            if(!area) return;

            if(!sishouData.active) {
                area.innerHTML = `<div style="font-size:13px; color:var(--sub-text);">一个人也可以很好，但有你陪伴的时光才是无与伦比的。</div>`;
                return;
            }

            let initialSecs = sishouData.mode === 'countup' ? Math.floor((Date.now() - sishouData.startTime)/1000) : sishouData.targetSeconds - Math.floor((Date.now() - sishouData.startTime)/1000);
            if(initialSecs < 0) initialSecs = 0;
            const hrs = String(Math.floor(initialSecs / 3600)).padStart(2,'0');
            const mins = String(Math.floor((initialSecs % 3600) / 60)).padStart(2,'0');
            const secs = String(initialSecs % 60).padStart(2,'0');

            let controlsHTML = '';
            if(sishouData.type === '共眠' || sishouData.type === '缱绻') {
                controlsHTML = `<button class="btn" style="width:100%; max-width:200px; border-radius:10px;" onclick="finishSiShouSession('stopped')">结束计时</button>`;
            } else {
                controlsHTML = `
                    <div style="display:flex; gap:10px; width:100%; max-width:240px; justify-content:center;">

                        <button class="btn" style="flex:1; border-radius:10px;" onclick="finishSiShouSession('stopped')">停止</button>
                    </div>
                `;
            }

            area.innerHTML = `

        function toggleSiShouPause() {
            if (sishouData.mode === 'countdown') {
                sishouData.isPaused = !sishouData.isPaused;
                saveData();
                updateSiShouActiveUI();
                return;
            }

            sishouData.isPaused = !sishouData.isPaused;
            saveData();
            updateSiShouActiveUI();
            if(!sishouData.isPaused) {
                sishouData.startTime = Date.now() - (sishouData.mode==='countup' ? sishouSecondsElapsed*1000 : (sishouData.targetSeconds - sishouCountdownRemaining)*1000);
                startSiShouTicker();
            }
        }

            const type = sishouData.type;

            }

            if (completedItems.length > 0) {
                compSec.innerHTML = `<div style="font-weight:bold; font-size:13px; color:var(--sub-text); margin-top:8px;">已完成 (${completedItems.length})</div>`;
                completedItems.forEach((item) => {
                    compSec.appendChild(createTodoCardElement(item, true));
                });
            }
        }

        function createTodoCardElement(item, isCompleted) {
            const div = document.createElement('div');
            div.className = 'anniv-item-card';
            if(isCompleted) div.style.opacity = '0.6';
            
            let timeBadge = item.timeStr ? `<span style="font-size:11px; background:${isCompleted?'var(--sub-text)':'var(--pine-green)'}; color:#fff; padding:2px 6px; border-radius:4px; margin-right:6px; flex-shrink:0;">${item.timeStr}</span>` : '';
            let starSymbol = item.important ? '⭐' : '☆';

            div.innerHTML = `
                <div style="display:flex; align-items:center; gap:8px; flex:1; overflow:hidden;">
                    <input type="checkbox" ${isCompleted ? 'checked' : ''} style="width:18px; height:18px; cursor:pointer; accent-color:var(--pine-green);" onclick="toggleTodoComplete(${item.id})">
                    <div style="display:flex; align-items:center; flex:1; overflow:hidden;">
                        ${timeBadge}
                        <span style="word-break:break-all; font-size:var(--font-size);">${item.text}</span>
                    </div>
                </div>
                <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
                    <span style="cursor:pointer; display:flex; align-items:center; font-size:18px;" onclick="toggleTodoImportant(${item.id}, event)" title="标记重要">${starSymbol}</span>
                    <button class="btn" style="padding:2px 6px; font-size:11px; background:none; border:1px solid var(--border-color); color:var(--text-color);" onclick="openTodoDetailPage(${item.id})">编辑</button>
                    <button class="btn" style="padding:2px 6px; font-size:11px; background:none; border:1px solid var(--border-color); color:var(--sub-text);" onclick="deleteTodoItem(${item.id})">删除</button>
                </div>
            `;
            return div;
        }

        function toggleTodoComplete(id) {
            const item = todoList.find(t => t.id === id);
            if(item) {
                item.completed = !item.completed;
                saveData();
                const subContent = document.getElementById('subPageContent');
                if(subContent) renderTodoMainPage(subContent);
                
                if(item.completed) {
                    const randomQuote = encouragementQuotes[Math.floor(Math.random() * encouragementQuotes.length)];
                    showLoveModal(randomQuote, [{ text: '确定', primary: true, onclick: 'closeLoveModal()' }]);
                }
            }
        }

        function toggleTodoImportant(id, event) {
            event.stopPropagation();
            const item = todoList.find(t => t.id === id);
            if(item) {
                item.important = !item.important;
                saveData();
                const subContent = document.getElementById('subPageContent');
                if(subContent) renderTodoMainPage(subContent);
            }
        }

        function deleteTodoItem(id) {
            if (confirm("确定要删除这条日程吗？")) {
                todoList = todoList.filter(t => t.id !== id);
                saveData();
                const subContent = document.getElementById('subPageContent');
                if(subContent) renderTodoMainPage(subContent);
            }
        }

        function openAddTodoModal() {
            const tabName = currentTodoTab === 'todolist' ? '新日程' : '新心愿';
            
            let overlay = document.getElementById('loveCustomModal');
            if(overlay) overlay.remove();

            overlay = document.createElement('div');
            overlay.id = 'loveCustomModal';
            overlay.className = 'love-modal-overlay';

            overlay.innerHTML = `
                <div class="love-modal-card" style="width: 90%; max-width: 320px; text-align:left; margin:auto;">
                    <div style="font-size:16px; font-weight:bold; text-align:center; margin-bottom:4px;">添加${tabName}：</div>
                    <div>
                        <textarea id="modalTodoInput" placeholder="请输入内容..." style="height: 120px; min-height: 100px; resize: none;"></textarea>
                    </div>
                    <div class="love-modal-buttons" style="margin-top:4px;">
                        <button class="btn" style="flex:1; background:var(--bg-color); color:var(--text-color); border:1px solid var(--border-color); border-radius:10px;" onclick="closeLoveModal()">取消</button>
                        <button class="btn" style="flex:1; border-radius:10px; background:var(--pine-green); color:#fff;" onclick="confirmAddTodoItem()">确定</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            setTimeout(() => {
                const inp = document.getElementById('modalTodoInput');
                if(inp) inp.focus();
            }, 100);
        }

        function confirmAddTodoItem() {
            const inp = document.getElementById('modalTodoInput');
            if(!inp) return;
            const text = inp.value.trim();
            if(!text) { alert('内容不能为空哦！'); return; }

            todoList.unshift({
                id: Date.now(),
                timeStr: '',
                text: text,
                important: false,
                completed: false,
                category: currentTodoTab
            });
            saveData();
            closeLoveModal();
            const subContent = document.getElementById('subPageContent');
            if(subContent) renderTodoMainPage(subContent);
        }

        function openTodoDetailPage(id) {
            const item = todoList.find(t => t.id === id);
            if(!item) return;

            const container = document.getElementById('subPageContent');
            if(!container) return;

            let timeDisplayHTML = item.timeStr ? `
                <div style="display:flex; align-items:center; gap:8px; background:rgba(120,120,120,0.08); padding:6px 12px; border-radius:16px; border:1px solid var(--border-color); display:inline-flex;">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <span style="font-size:12px;">${item.timeStr}</span>
                    <span style="cursor:pointer; font-weight:bold; margin-left:4px;" onclick="clearTodoTime(${item.id})">✕</span>
                </div>
            ` : '';

            container.innerHTML = `
                <div style="padding:16px; display:flex; flex-direction:column; gap:16px; height:100%; position:relative;">
                    <div style="font-size:18px; font-weight:bold; word-break:break-all;">${item.text}</div>
                    
                    <div style="display:flex; flex-direction:column; gap:12px;">
                        <div style="display:flex; align-items:center; gap:12px; cursor:pointer; color:var(--sub-text);" onclick="openTaskDateTimePicker(${item.id})">
                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                            <span style="font-size:14px; color:var(--text-color);">添加日期/时间</span>
                        </div>
                        <div id="taskTimeTagArea">${timeDisplayHTML}</div>
                    </div>

                    <div style="margin-top:auto; padding-bottom:20px; display:flex; justify-content:center;">
                        <button class="btn" style="width:100%;" onclick="renderTodoMainPage(document.getElementById('subPageContent'))">完成并返回</button>
                    </div>
                </div>
            `;
        }

        function clearTodoTime(id) {
            const item = todoList.find(t => t.id === id);
            if(item) {
                item.timeStr = '';
                saveData();
                openTodoDetailPage(id);
            }
        }

        function openTaskDateTimePicker(id) {
            const item = todoList.find(t => t.id === id);
            if(!item) return;

            let overlay = document.getElementById('loveCustomModal');
            if(overlay) overlay.remove();

            overlay = document.createElement('div');
            overlay.id = 'loveCustomModal';
            overlay.className = 'love-modal-overlay';

            const now = new Date();
            const defaultDateStr = now.toISOString().slice(0, 10);

            overlay.innerHTML = `
                <div class="love-modal-card" style="width: 90%; max-width: 320px; text-align:left; margin:auto; box-sizing:border-box;">
                    <div style="font-size:16px; font-weight:bold; text-align:center; margin-bottom:8px;">选择日期和时间</div>
                    <div style="display:flex; flex-direction:column; gap:10px; width:100%;">
                        <div style="width:100%;">
                            <label style="font-size:12px; color:var(--sub-text); display:block; margin-bottom:4px;">选择日期：</label>
                            <input type="date" id="pickerDateInput" value="${defaultDateStr}" style="width:100%; box-sizing:border-box;">
                        </div>
                        <div style="width:100%;">
                            <label style="font-size:12px; color:var(--sub-text); display:block; margin-bottom:4px;">选择时间 (可选)：</label>
                            <input type="time" id="pickerTimeInput" value="09:00" style="width:100%; box-sizing:border-box;">
                        </div>
                    </div>
                    <div class="love-modal-buttons" style="margin-top:12px; width:100%;">
                        <button class="btn" style="flex:1; background:var(--bg-color); color:var(--text-color); border:1px solid var(--border-color); border-radius:10px;" onclick="closeLoveModal()">取消</button>
                        <button class="btn" style="flex:1; border-radius:10px; background:var(--pine-green); color:#fff;" onclick="confirmTaskDateTimePicker(${id})">确定</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function confirmTaskDateTimePicker(id) {
            const item = todoList.find(t => t.id === id);
            const dateVal = document.getElementById('pickerDateInput').value;
            const timeVal = document.getElementById('pickerTimeInput').value;
            if(!item || !dateVal) return;

            let timeStr = dateVal;
            if(timeVal) timeStr += ` ${timeVal}`;

            item.timeStr = timeStr;
            saveData();
            closeLoveModal();
            openTodoDetailPage(id);
        }

        // --- 设置模块 ---
        function initSettings(container) {
            container.innerHTML = `
                <div style="padding: 12px; display: flex; flex-direction: column; gap: 12px; height: 100%;">
                    <div class="setting-group">
                        <div class="setting-label">我的名字</div>
                        <input type="text" id="set_myName" value="${tempSettings.myName || ''}">
                    </div>
                    <div class="setting-group">
                        <div class="setting-label">对方名字</div>
                        <input type="text" id="set_partnerName" value="${tempSettings.partnerName || ''}">
                    </div>
                    <div class="setting-group">
                        <div class="setting-label">我的头像</div>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <input type="file" accept="image/*" onchange="compressAndStoreImage(event, 'myAvatar')" style="flex:1;">
                        </div>
                        <div id="myAvatarPreviewArea" style="margin-top:6px;"></div>
                    </div>
                    <div class="setting-group">
                        <div class="setting-label">对方头像</div>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <input type="file" accept="image/*" onchange="compressAndStoreImage(event, 'partnerAvatar')" style="flex:1;">
                        </div>
                        <div id="partnerAvatarPreviewArea" style="margin-top:6px;"></div>
                    </div>
                    <div class="setting-group">
                        <div class="setting-label">聊天背景图</div>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <input type="file" accept="image/*" onchange="compressAndStoreImage(event, 'chatBg')" style="flex:1;">
                        </div>
                        <div id="chatBgPreviewArea" style="margin-top:6px;"></div>
                    </div>

                    <div class="setting-group">
                        <div class="setting-label">对方回复时间范围 (秒)</div>
                        <div style="display:flex; align-items:center; gap:8px; font-size:12px;">
                            <span>最小秒数：</span>
                            <input type="number" id="set_replyDelayMin" value="${tempSettings.replyDelayMin || '5'}" min="1" max="600" style="flex:1;">
                            <span>最大秒数 (最高600秒)：</span>
                            <input type="number" id="set_replyDelayMax" value="${tempSettings.replyDelayMax || '30'}" min="1" max="600" style="flex:1;">
                        </div>
                    </div>

                    <div class="setting-group">
                        <div class="setting-label">🎨 聊天气泡颜色自定义</div>
                        <div style="display:flex; flex-direction:column; gap:6px; font-size:12px;">
                            <div style="display:flex; align-items:center; justify-content:space-between;">
                                <span>我的气泡背景色：</span>
                                <input type="color" id="set_myBubbleBg" value="${tempSettings.myBubbleBg || '#4a7c59'}" style="width:60px; height:32px; padding:0; border:none; cursor:pointer;">
                            </div>
                            <div style="display:flex; align-items:center; justify-content:space-between;">
                                <span>我的气泡文字色：</span>
                                <input type="color" id="set_myBubbleText" value="${tempSettings.myBubbleText || '#ffffff'}" style="width:60px; height:32px; padding:0; border:none; cursor:pointer;">
                            </div>
                            <div style="display:flex; align-items:center; justify-content:space-between;">
                                <span>对方气泡背景色：</span>
                                <input type="color" id="set_partnerBubbleBg" value="${tempSettings.partnerBubbleBg || '#eaeaea'}" style="width:60px; height:32px; padding:0; border:none; cursor:pointer;">
                            </div>
                            <div style="display:flex; align-items:center; justify-content:space-between;">
                                <span>对方气泡文字色：</span>
                                <input type="color" id="set_partnerBubbleText" value="${tempSettings.partnerBubbleText || '#111111'}" style="width:60px; height:32px; padding:0; border:none; cursor:pointer;">
                            </div>
                            <button class="btn" style="padding:4px 8px; font-size:11px; margin-top:4px; background:none; border:1px solid var(--border-color); color:var(--text-color);" onclick="resetBubbleColors()">恢复默认气泡颜色</button>
                        </div>
                    </div>

                    <div class="setting-group">
                        <div class="setting-label">✨ 心情栏颜色自定义</div>
                        <div style="display:flex; flex-direction:column; gap:6px; font-size:12px;">
                            <div style="display:flex; align-items:center; justify-content:space-between;">
                                <span>心情栏背景色 (支持半透明)：</span>
                                <input type="text" id="set_moodBgColor" value="${tempSettings.moodBgColor || 'rgba(255, 255, 255, 0.65)'}" style="flex:1; margin-left:10px;">
                            </div>
                            <div style="display:flex; align-items:center; justify-content:space-between;">
                                <span>心情栏文字颜色：</span>
                                <input type="color" id="set_moodTextColor" value="${tempSettings.moodTextColor || '#666666'}" style="width:60px; height:32px; padding:0; border:none; cursor:pointer;">
                            </div>
                            <button class="btn" style="padding:4px 8px; font-size:11px; margin-top:4px; background:none; border:1px solid var(--border-color); color:var(--text-color);" onclick="resetMoodColors()">恢复默认心情栏颜色</button>
                        </div>
                    </div>

                    <div class="setting-group">
                        <div class="setting-label">自定义主题</div>
                        <div style="display:flex; align-items:center; justify-content:space-between; font-size:12px;">
                            <span>选择系统主色调：</span>
                            <input type="color" id="set_pineGreen" value="${tempSettings.pineGreen || '#4a7c59'}" style="width:60px; height:32px; padding:0; border:none; cursor:pointer;">
                        </div>
                    </div>

                    <div class="setting-group">
                        <div class="setting-label">数据恢复与备份</div>
                        <div style="display:flex; gap:8px;">
                            <button class="btn" style="flex:1; background:none; border:1px solid var(--border-color); color:var(--text-color);" onclick="exportData()">手动导出备份</button>
                            <button class="btn" style="flex:1; background:none; border:1px solid var(--border-color); color:var(--text-color);" onclick="document.getElementById('importFile').click()">导入备份恢复</button>
                            <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
                        </div>
                    </div>

                    <div style="display:flex; gap:10px; margin-top:10px; margin-bottom:20px;">
                        <button class="btn" style="flex:1; background:var(--pine-green); color:#fff;" onclick="saveSettingsChanges()">保存修改</button>
                        <button class="btn" style="flex:1; background-color:transparent; border:1px solid var(--border-color); color:var(--sub-text);" onclick="cancelSettingsChanges()">取消修改</button>
                    </div>
                </div>
            `;
            renderAvatarPreviews();
        }

        function resetBubbleColors() {
            tempSettings.myBubbleBg = '';
            tempSettings.myBubbleText = '';
            tempSettings.partnerBubbleBg = '';
            tempSettings.partnerBubbleText = '';
            document.getElementById('set_myBubbleBg').value = '#4a7c59';
            document.getElementById('set_myBubbleText').value = '#ffffff';
            document.getElementById('set_partnerBubbleBg').value = '#eaeaea';
            document.getElementById('set_partnerBubbleText').value = '#111111';
        }

        function resetMoodColors() {
            tempSettings.moodBgColor = '';
            tempSettings.moodTextColor = '';
            document.getElementById('set_moodBgColor').value = 'rgba(255, 255, 255, 0.65)';
            document.getElementById('set_moodTextColor').value = '#666666';
        }

        function renderAvatarPreviews() {
            renderSingleAvatarPreview('myAvatar', 'myAvatarPreviewArea');
            renderSingleAvatarPreview('partnerAvatar', 'partnerAvatarPreviewArea');
            renderSingleAvatarPreview('chatBg', 'chatBgPreviewArea');
        }

        function renderSingleAvatarPreview(key, areaId) {
            const area = document.getElementById(areaId);
            if (!area) return;
            area.innerHTML = '';
            if (!tempSettings[key]) {
                area.innerHTML = `<span style="font-size:11px; color:var(--sub-text);">暂无图片</span>`;
                return;
            }
            const wrap = document.createElement('div');
            wrap.style.cssText = key === 'chatBg' ? "position:relative; width:80px; height:52px;" : "position:relative; width:52px; height:52px;";
            wrap.innerHTML = `
                <img src="${tempSettings[key]}" style="width:100%; height:100%; object-fit:cover; border-radius:8px; border:1px solid var(--border-color);">
                <button onclick="clearSettingImage('${key}')" style="position:absolute; top:-6px; right:-6px; width:18px; height:18px; background:rgba(0,0,0,0.5); color:#fff; border:none; border-radius:50%; font-size:11px; display:flex; align-items:center; justify-content:center; cursor:pointer;">×</button>
            `;
            area.appendChild(wrap);
        }

        function clearSettingImage(key) {
            tempSettings[key] = '';
            renderAvatarPreviews();
        }

        function compressAndStoreImage(event, targetKey) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1200;
                    const MAX_HEIGHT = 1200;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    tempSettings[targetKey] = canvas.toDataURL('image/jpeg', 0.95);
                    renderAvatarPreviews();
                }
            };
            reader.readAsDataURL(file);
        }

        function saveSettingsChanges() {
            const mName = document.getElementById('set_myName');
            const pName = document.getElementById('set_partnerName');
            const pGreen = document.getElementById('set_pineGreen');
            const dMin = document.getElementById('set_replyDelayMin');
            const dMax = document.getElementById('set_replyDelayMax');
            const mbBg = document.getElementById('set_myBubbleBg');
            const mbText = document.getElementById('set_myBubbleText');
            const pbBg = document.getElementById('set_partnerBubbleBg');
            const pbText = document.getElementById('set_partnerBubbleText');
            const mBg = document.getElementById('set_moodBgColor');
            const mText = document.getElementById('set_moodTextColor');

            if(mName) tempSettings.myName = mName.value.trim();
            if(pName) tempSettings.partnerName = pName.value.trim();
            if(pGreen) tempSettings.pineGreen = pGreen.value;
            if(dMin) tempSettings.replyDelayMin = dMin.value.trim();
            if(dMax) tempSettings.replyDelayMax = dMax.value.trim();
            if(mbBg) tempSettings.myBubbleBg = mbBg.value;
            if(mbText) tempSettings.myBubbleText = mbText.value;
            if(pbBg) tempSettings.partnerBubbleBg = pbBg.value;
            if(pbText) tempSettings.partnerBubbleText = pbText.value;
            if(mBg) tempSettings.moodBgColor = mBg.value.trim();
            if(mText) tempSettings.moodTextColor = mText.value;

            settings.myName = tempSettings.myName;
            settings.partnerName = tempSettings.partnerName;
            settings.pineGreen = tempSettings.pineGreen;
            settings.replyDelayMin = tempSettings.replyDelayMin;
            settings.replyDelayMax = tempSettings.replyDelayMax;
            settings.myAvatar = tempSettings.myAvatar;
            settings.partnerAvatar = tempSettings.partnerAvatar;
            settings.chatBg = tempSettings.chatBg;
            settings.myBubbleBg = tempSettings.myBubbleBg;
            settings.myBubbleText = tempSettings.myBubbleText;
            settings.partnerBubbleBg = tempSettings.partnerBubbleBg;
            settings.partnerBubbleText = tempSettings.partnerBubbleText;
            settings.moodBgColor = tempSettings.moodBgColor;
            settings.moodTextColor = tempSettings.moodTextColor;

            saveData();
            alert('保存成功！');
            closeApp();
        }

        function cancelSettingsChanges() {
            tempSettings = JSON.parse(JSON.stringify(settings));
            alert('已取消修改。');
            closeApp();
        }

        function exportData() {
            const backupData = { cardLibrary, actionLibrary, chatMessages, letters, anniversaries, heartMoments, todoList, sishouData, sishouRecords, settings, annivCheckInData };
            const jsonString = JSON.stringify(backupData, null, 2);
            
            const blob = new Blob([jsonString], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const downloadAnchor = document.createElement('a');
            downloadAnchor.href = url;
            downloadAnchor.download = `Sanemi_Backup_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            document.body.removeChild(downloadAnchor);
            URL.revokeObjectURL(url);
            
            alert('备份已生成！在弹出的提示中点击“下载”后，文件会自动保存在手机自带的【文件 (Files)】App 中的【下载 (Downloads)】或【iCloud 云盘】文件夹里哦！');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.cardLibrary) cardLibrary = imported.cardLibrary;
                    if (imported.actionLibrary) actionLibrary = imported.actionLibrary;
                    if (imported.chatMessages) chatMessages = imported.chatMessages;
                    if (imported.letters) letters = imported.letters;
                    if (imported.anniversaries) anniversaries = imported.anniversaries;
                    if (imported.heartMoments) heartMoments = imported.heartMoments;
                    if (imported.todoList) todoList = imported.todoList;
                    if (imported.sishouData) sishouData = imported.sishouData;
                    if (imported.sishouRecords) sishouRecords = imported.sishouRecords;
                    if (imported.settings) settings = imported.settings;
                    if (imported.annivCheckInData) annivCheckInData = imported.annivCheckInData;
                    saveData();
                    alert('数据恢复同步成功！');
                    location.reload();
                } catch (err) {
                    alert('导入失败，文件格式错误！');
                }
            };
            reader.readAsText(file);
        }

        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;
        themeToggle.onclick = () => {
            if (htmlElement.getAttribute('data-theme') === 'dark') {
                htmlElement.removeAttribute('data-theme');
            } else {
                htmlElement.setAttribute('data-theme', 'dark');
            }
        };
    </script>
</body>
</html>
